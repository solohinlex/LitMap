[project]
name = "litmap"
version = "0.1.0"
description = "Q&A and summaries over isolated literary corpora"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "openai>=1.50",
    "platformdirs>=4.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
litmap = "litmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
